<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog | Simple Blog</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h2>Simple Blog</h2>

            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/add-blog.html">Add Blog</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>

            <h1>Add New Blog</h1>

            <form id="blogForm">

                <label for="title">Blog Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter blog title"
                >
                <small id="titleError" class="error"></small>

                <label for="author">Author Name</label>
                <input
                    type="text"
                    id="author"
                    placeholder="Enter author name"
                >
                <small id="authorError" class="error"></small>

                <label for="content">Blog Content</label>
                <textarea
                    id="content"
                    rows="8"
                    placeholder="Write your blog here..."
                ></textarea>
                <small id="contentError" class="error"></small>

                <button type="submit">Add Blog</button>

            </form>

            <!-- Success / Error Message -->
            <p id="message"></p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Simple Blog Management System | CodeMax Internship</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
